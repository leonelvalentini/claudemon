name: paquete

# Verifica que el paquete de PyPI se construya bien y que se instale y ande en cada sistema.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  instalar:
    name: instalar · ${{ matrix.os }} · Python ${{ matrix.python }}
    needs: construir
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.8"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Instalar el paquete con el extra [vivo]
        shell: bash
        run: python -m pip install "$(ls dist/*.whl)[vivo]"
      - name: Probar el comando instalado
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          claudemon --version
          claudemon demo | head -6
          claudemon diagnostico | head -4
