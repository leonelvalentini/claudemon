[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claudemon-cli"
dynamic = ["version"]
description = "Monitor del consumo de Claude Code: qué sesión gasta más, quién usa Opus (conversación vs subagentes) y cuánto te queda en el plan."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leonel Valentini" }]
keywords = ["claude", "claude-code", "anthropic", "tokens", "usage", "monitor", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
# Sin dependencias: los informes funcionan solo con la librería estándar.
dependencies = []

[project.optional-dependencies]
# Solo para la pantalla en vivo (CPU, memoria, procesos): pipx install "claudemon-cli[vivo]"
vivo = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/leonelvalentini/claudemon"
Documentation = "https://github.com/leonelvalentini/claudemon#readme"
Issues = "https://github.com/leonelvalentini/claudemon/issues"
Changelog = "https://github.com/leonelvalentini/claudemon/releases"

[project.scripts]
claudemon = "claudemon:main"

[tool.setuptools]
py-modules = ["claudemon"]

[tool.setuptools.dynamic]
version = { attr = "claudemon.VERSION" }
